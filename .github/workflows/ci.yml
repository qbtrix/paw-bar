# ci.yml — checks for the Paw Bar widget.
# Created 2026-08-19.
#
# This repo had NO CI. Every check below already existed as a package script
# and had to be remembered by hand, which is the same as not having them: the
# messenger PR was the largest change this repo has taken and nothing was
# checking it.
#
# The root `bun run test` (Playwright, tests/widget.spec.ts) is deliberately NOT
# wired up yet. It fails 4 of 5 on a clean `main`, so adding it here would make
# the first green build impossible and teach everyone to ignore the badge. It
# wants its own fix first.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Glass app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, and pinned to a version that can READ these lockfiles:
          # app/bun.lock carries "configVersion": 1, which older bun does not
          # understand, so a lower pin fails --frozen-lockfile for reasons that
          # have nothing to do with the change under review.
          bun-version: 1.3.14
      # --frozen-lockfile: CI must install the resolution the lockfile pins, so
      # a dependency cannot drift in here without showing up as a lockfile diff
      # in someone's PR. This is also what keeps the 7-day min-release-age
      # policy meaningful.
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run check
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      # The first-paint budget. It is a build artifact check, so it has to run
      # after the build rather than beside it.
      - name: Bundle size
        run: bun run size

  loader:
    name: Loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, and pinned to a version that can READ these lockfiles:
          # app/bun.lock carries "configVersion": 1, which older bun does not
          # understand, so a lower pin fails --frozen-lockfile for reasons that
          # have nothing to do with the change under review.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run typecheck:loader
      - name: Build
        run: bun run build:loader
      # The loader's tests read dist/loader.js — the exact shipped IIFE, not the
      # TypeScript source — so the build above is a prerequisite, not a parallel
      # job.
      - name: Tests
        run: bun run test:loader
      - name: Size
        run: bun run size:loader

  line-endings:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Committing a CRLF file into an LF repo turns every later one-line edit
      # into a whole-file diff, which makes review impossible and collides with
      # anyone else touching the same file. It has already happened twice in
      # this codebase, both times unnoticed until the diff was unreadable.
      - name: No CRLF in tracked text files
        run: |
          # i/ is the INDEX (the committed blob); w/ is the working copy, which a
          # Windows checkout may legitimately convert. Only the index matters.
          bad=$(git ls-files --eol | grep '^i/crlf' | sed 's/.*	//')
          if [ -n "$bad" ]; then
            echo "These tracked files have CRLF line endings:"
            echo "$bad"
            echo
            echo "Fix with: python -c \"import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))\" <file>"
            exit 1
          fi
          echo "OK: no tracked file has CRLF line endings."
